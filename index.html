<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEON GRID — Direktori AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0914;--panel:#141228;--line:#2a2650;--tx:#e9e7ff;--mut:#8f8bbd;--mag:#ff2e88;--cy:#2ef2ff;--am:#ffb347;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:64px}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 "IBM Plex Sans",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,.brand{font-family:"Chakra Petch",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(10,9,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.burger{width:44px;height:44px;border:1px solid var(--cy);background:none;border-radius:4px;display:grid;place-content:center;gap:5px;cursor:pointer}
.burger i{display:block;width:22px;height:2px;background:var(--cy)}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.04em}
.brand b{color:var(--mag)}
.cur{margin-left:auto;color:var(--mut);font-size:.85rem;text-align:right}

/* hero: retro sun over a city skyline */
.hero{position:relative;overflow:hidden;padding:36px 18px 0;background:linear-gradient(#150a2e,#2a0f45 70%,#4a1550)}
.hero h1{font-size:clamp(1.9rem,8vw,3.4rem);line-height:1.05;max-width:12ch;position:relative;z-index:2}
.hero p{margin:12px 0 22px;max-width:34ch;color:#cfc9ff;position:relative;z-index:2}
.sun{position:absolute;right:-40px;top:24px;width:220px;height:220px;border-radius:50%;background:linear-gradient(#ffb347,#ff2e88);
-webkit-mask:repeating-linear-gradient(#000 0 14px,transparent 14px 18px);mask:repeating-linear-gradient(#000 0 14px,transparent 14px 18px);opacity:.9}
.city{display:block;width:100%;height:auto;position:relative;z-index:2;margin-top:-10px}

/* search */
.tools{padding:18px 14px 6px;max-width:980px;margin:auto}
.search{width:100%;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--tx);font:inherit}
.search::placeholder{color:var(--mut)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:18px}
.head h2{font-size:1.4rem;color:var(--cy)}
.head span{color:var(--mut);font-size:.9rem}

/* cards */
.grid{display:grid;gap:12px;padding:12px 14px 24px;max-width:980px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--mag);border-radius:4px;padding:14px}
.card h3{font-size:1.1rem}
.card .dom{color:var(--mut);font-size:.8rem;word-break:break-all}
.card p{margin:8px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;padding:0;list-style:none}
.tags li{font-size:.78rem;padding:2px 8px;border:1px solid var(--line);border-radius:3px;color:var(--cy)}
.go{display:inline-block;padding:8px 14px;border:1px solid var(--mag);color:var(--mag);border-radius:4px;text-decoration:none;font-weight:500}
.go:hover{background:var(--mag);color:#0a0914}
.more{display:block;margin:0 auto 40px;padding:12px 26px;background:none;border:1px solid var(--cy);color:var(--cy);border-radius:4px;font:inherit;cursor:pointer}
.empty{padding:30px 14px;text-align:center;color:var(--mut)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:40;background:#0f0d20;border-right:1px solid var(--cy);padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(-102%);transition:transform .25s}
body.open .drawer{transform:none}
body.open .scrim{opacity:1;pointer-events:auto}
.drawer h2{padding:0 18px 10px;font-size:.95rem;color:var(--mut);font-weight:500}
.drawer button{display:flex;justify-content:space-between;width:100%;padding:14px 18px;background:none;border:0;border-left:3px solid transparent;color:var(--tx);font:500 1rem "Chakra Petch",sans-serif;text-align:left;cursor:pointer}
.drawer button small{color:var(--mut);font:400 .85rem "IBM Plex Sans",sans-serif}
.drawer button[aria-current=true]{border-left-color:var(--mag);background:#1b1736;color:var(--cy)}
footer{padding:20px 14px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--mut);font-size:.85rem;border-top:1px solid var(--line)}

@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}.hero{padding:56px 40px 0}.sun{width:320px;height:320px;right:6%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <button class="burger" id="burger" aria-label="Buka menu kategori" aria-expanded="false" aria-controls="drawer"><i></i><i></i><i></i></button>
  <span class="brand">NEON<b>GRID</b></span>
  <span class="cur" id="cur">Semua AI</span>
</header>

<section class="hero">
  <div class="sun"></div>
  <h1>Direktori AI kota neon</h1>
  <p>Temukan alat AI berdasarkan kategori, lengkap dengan fungsi dan fiturnya.</p>
  <svg class="city" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#0a0914">
      <rect x="0" y="50" width="28" height="40"/><rect x="28" y="30" width="22" height="60"/><rect x="50" y="58" width="30" height="32"/>
      <rect x="80" y="14" width="26" height="76"/><rect x="106" y="44" width="34" height="46"/><rect x="140" y="26" width="20" height="64"/>
      <rect x="160" y="52" width="36" height="38"/><rect x="196" y="6" width="24" height="84"/><rect x="220" y="36" width="30" height="54"/>
      <rect x="250" y="56" width="26" height="34"/><rect x="276" y="20" width="22" height="70"/><rect x="298" y="46" width="38" height="44"/>
      <rect x="336" y="28" width="24" height="62"/><rect x="360" y="52" width="40" height="38"/>
    </g>
    <g fill="#ff2e88"><rect x="84" y="22" width="3" height="3"/><rect x="200" y="14" width="3" height="3"/><rect x="280" y="30" width="3" height="3"/></g>
    <g fill="#2ef2ff"><rect x="32" y="40" width="3" height="3"/><rect x="144" y="36" width="3" height="3"/><rect x="340" y="38" width="3" height="3"/><rect x="226" y="48" width="3" height="3"/></g>
  </svg>
</section>

<div class="tools">
  <input class="search" id="q" type="search" placeholder="Cari nama atau fungsi AI…" aria-label="Cari AI">
  <div class="head"><h2 id="title">Semua AI</h2><span id="count"></span></div>
</div>
<main class="grid" id="list"></main>
<button class="more" id="more" hidden>Muat lebih banyak</button>

<div class="scrim" id="scrim"></div>
<nav class="drawer" id="drawer" aria-label="Kategori AI"><h2>Kategori</h2><div id="cats"></div></nav>
<footer>NEONGRID · Direktori AI · Cek ulang URL sebelum dipakai karena layanan bisa berubah</footer>

<script src="ais.js"></script>
<script>
const PAGE = 40;
const all = Object.entries(AI_DATA).flatMap(([cat, arr]) => arr.map(a => ({cat, name:a[0], url:a[1], fn:a[2], ft:a[3].split("|")})));
let cat = "Semua", q = "", shown = PAGE;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setMenu(open){
  document.body.classList.toggle("open", open);
  $("burger").setAttribute("aria-expanded", open);
  if(open) $("cats").querySelector("[aria-current=true]").focus(); else $("burger").focus();
}

function buildCats(){
  const names = ["Semua", ...Object.keys(AI_DATA)];
  $("cats").innerHTML = names.map(n => {
    const c = n === "Semua" ? all.length : AI_DATA[n].length;
    return `<button data-c="${esc(n)}" aria-current="${n===cat}">${esc(n)}<small>${c}</small></button>`;
  }).join("");
}

function render(){
  const k = q.toLowerCase();
  const rows = all.filter(a => (cat === "Semua" || a.cat === cat) && (!k || (a.name + a.fn + a.ft.join(" ")).toLowerCase().includes(k)));
  $("title").textContent = cat === "Semua" ? "Semua AI" : cat;
  $("cur").textContent = cat === "Semua" ? "Semua AI" : cat;
  $("count").textContent = rows.length + " AI";
  $("list").innerHTML = rows.slice(0, shown).map(a => `
    <article class="card">
      <h3>${esc(a.name)}</h3>
      <div class="dom">${esc(new URL(a.url).hostname.replace(/^www\./,""))}</div>
      <p>${esc(a.fn)}</p>
      <ul class="tags">${a.ft.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <a class="go" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Buka situs</a>
    </article>`).join("") || `<p class="empty">Tidak ada AI yang cocok. Coba kata kunci lain atau pilih kategori Semua.</p>`;
  $("more").hidden = rows.length <= shown;
}

$("burger").onclick = () => setMenu(!document.body.classList.contains("open"));
$("scrim").onclick = () => setMenu(false);
document.addEventListener("keydown", e => { if(e.key === "Escape") setMenu(false); });
$("cats").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  cat = b.dataset.c; shown = PAGE; buildCats(); render(); setMenu(false); scrollTo({top:0});
};
$("q").oninput = e => { q = e.target.value.trim(); shown = PAGE; render(); };
$("more").onclick = () => { shown += PAGE; render(); };

buildCats(); render();
</script>
</body>
</html>
